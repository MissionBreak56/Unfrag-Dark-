name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e . pytest
      - run: pytest -q --tb=short --junitxml=junit.xml
      - name: Mostrar falhas do pytest como anotações
        if: failure()
        shell: python {0}
        run: |
          import xml.etree.ElementTree as ET
          try:
              root = ET.parse("junit.xml").getroot()
          except Exception as e:
              print("::error title=pytest::sem junit.xml: %s" % e)
              raise SystemExit(0)
          for tc in root.iter("testcase"):
              for bad in list(tc.findall("failure")) + list(tc.findall("error")):
                  txt = (bad.get("message", "") + "\n" + (bad.text or ""))[-1500:]
                  txt = txt.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                  print("::error title=%s::%s" % (tc.get("name"), txt))

  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pyinstaller
      - name: GUI (pede administrador)
        run: pyinstaller --onefile --windowed --uac-admin --name UnfragDark --hidden-import pystray._win32 --hidden-import PIL.Image --icon src/unfrag/assets/icon.ico --add-data "src/unfrag/assets;unfrag/assets" --paths src launcher.py
      - name: CLI
        run: pyinstaller --onefile --uac-admin --name unfrag --icon src/unfrag/assets/icon.ico --add-data "src/unfrag/assets;unfrag/assets" --paths src launcher.py
      - name: Smoke test do CLI em modo demo
        run: .\dist\unfrag.exe --demo list
      - uses: actions/upload-artifact@v4
        with:
          name: UnfragDark-windows
          path: dist/*.exe

  release:
    # Release automática: ao subir na main uma versão (pyproject.toml) que ainda não tem release,
    # ou ao empurrar uma tag v*. Basta aumentar a versão para publicar.
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    needs: windows-exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: UnfragDark-windows
          path: dist
      - name: Checksums
        run: cd dist && sha256sum *.exe > SHA256SUMS.txt
      - name: Publicar release com as mudanças do CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(sed -n 's/^version *= *"\(.*\)"/\1/p' pyproject.toml | head -1)"
          fi
          # texto da release = seção "## vX.Y.Z" do CHANGELOG.md + aviso fixo
          awk -v t="## $TAG" '$0==t{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md não tem a seção '## $TAG'. Descreva as mudanças dessa versão."
            exit 1
          fi
          printf '\n---\nUnfragDark.exe (interface gráfica) e unfrag.exe (linha de comando). Ambos pedem execução como Administrador. Validado em Windows NTFS no CI, mas não em hardware variado: faça backup e comece por `unfrag analyze C:`. Use `--demo` para testar sem tocar em discos.\n' >> notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Unfrag Dark $TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Unfrag Dark $TAG" --notes-file notes.md
          fi
