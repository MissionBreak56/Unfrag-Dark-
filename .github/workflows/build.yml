name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e . pytest
      - run: pytest -q --tb=short --junitxml=junit.xml
      - name: Mostrar falhas do pytest como anotações
        if: failure()
        shell: python {0}
        run: |
          import xml.etree.ElementTree as ET
          try:
              root = ET.parse("junit.xml").getroot()
          except Exception as e:
              print("::error title=pytest::sem junit.xml: %s" % e)
              raise SystemExit(0)
          for tc in root.iter("testcase"):
              for bad in list(tc.findall("failure")) + list(tc.findall("error")):
                  txt = (bad.get("message", "") + "\n" + (bad.text or ""))[-1500:]
                  txt = txt.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                  print("::error title=%s::%s" % (tc.get("name"), txt))

  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pyinstaller
      - name: GUI (pede administrador)
        run: pyinstaller --onefile --windowed --uac-admin --name UnfragDark --hidden-import pystray._win32 --hidden-import PIL.Image --icon src/unfrag/assets/icon.ico --add-data "src/unfrag/assets;unfrag/assets" --paths src launcher.py
      - name: CLI
        run: pyinstaller --onefile --uac-admin --name unfrag --icon src/unfrag/assets/icon.ico --add-data "src/unfrag/assets;unfrag/assets" --paths src launcher.py
      - name: Smoke test do CLI em modo demo
        run: .\dist\unfrag.exe --demo list
      - uses: actions/upload-artifact@v4
        with:
          name: UnfragDark-windows
          path: dist/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: UnfragDark-windows
          path: dist
      - name: Checksums
        run: cd dist && sha256sum *.exe > SHA256SUMS.txt
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "Unfrag Dark ${{ github.ref_name }}" \
            --notes "Primeira versão. UnfragDark.exe (interface gráfica escura) e unfrag.exe (linha de comando). Ambos pedem execução como Administrador. O backend Windows ainda não foi validado em hardware real: faça backup e comece por 'unfrag analyze C:'. Use '--demo' para testar sem tocar em discos."
