[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "unfrag-dark"
version = "0.1.0"
description = "Desfragmentador NTFS de código aberto com tema escuro"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
  "Operating System :: Microsoft :: Windows",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.scripts]
unfrag = "unfrag.cli:main"

[project.gui-scripts]
unfrag-gui = "unfrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
